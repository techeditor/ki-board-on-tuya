[package]
name = "agentic-keyboard-companion"
version = "0.1.0"
description = "Companion app for the T5AI-Core agentic keyboard"
authors = ["Kiro"]
edition = "2021"

[lib]
name = "agentic_keyboard_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[target.'cfg(target_os = "windows")'.build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "windows")'.dependencies]
serialport = "4"
tauri = { version = "2", features = [] }

[dev-dependencies]
env_logger = "0.11"
