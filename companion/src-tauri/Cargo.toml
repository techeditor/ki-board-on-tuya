[package]
name = "agentic-keyboard-companion"
version = "0.1.0"
description = "Companion app for the T5AI-Core agentic keyboard"
authors = ["Kiro"]
edition = "2021"

[lib]
name = "agentic_keyboard_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[target.'cfg(target_os = "windows")'.build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Serial I/O is cross-platform. `default-features = false` drops the `libudev`
# feature so the crate builds on the Linux CI host without libudev-dev; real
# port enumeration only runs on the Windows target.
serialport = { version = "4", default-features = false }
# FP-4: session-control HTTP client. Pinned to the version already resolved in
# Cargo.lock (pulled transitively by tauri) so adding it as a direct dep does
# not churn the lockfile. `default-features = false` + `rustls` selects the
# rustls TLS backend (no OpenSSL system dep), so the crate builds on the Linux
# CI host. NB: reqwest 0.13 renamed this feature `rustls-tls` -> `rustls`.
reqwest = { version = "=0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri = { version = "2", features = [] }

[dev-dependencies]
env_logger = "0.11"
